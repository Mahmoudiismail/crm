[package]
name = "tasker"
version = "1.1.0"
edition = "2021"
autobins = false

[lib]
name = "tasker_app"
path = "src/lib.rs"

[[bin]]
name = "tasker"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
calamine = "0.38.0"
chrono = { version = "0.4.44", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4.6.1", features = ["derive"] }
crm_tool = { path = "../.." }
csv = "1.3.0"
rand = "0.10.1"
regex = "1.13.0"
rust_xlsxwriter = "0.101.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tempfile = "3.10.1"
tracing = "0.1.44"
walkdir = "2.4.0"
