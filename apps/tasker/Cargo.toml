[package]
name = "tasker"
version = "1.1.0"
edition = "2021"
autobins = false

[[bin]]
name = "tasker"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
