[package]
name = "runner"
version = "1.1.0"
edition = "2021"
autobins = false

[[bin]]
name = "runner"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
crm_tool = { path = "../.." }
open = "5.3.3"
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "fs", "io-util", "time", "sync", "net", "process", "signal"] }
tracing = "0.1.44"

[target.'cfg(target_os = "windows")'.dependencies]
tray-icon = "0.24.0"
muda = "0.19.2"
winit = "0.30.13"

[dev-dependencies]
tempfile = "3.10.1"
