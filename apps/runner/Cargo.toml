[package]
name = "runner"
version = "1.1.0"
edition = "2021"
autobins = false
build = "build.rs"

[lib]
name = "runner_app"
path = "src/lib.rs"

[[bin]]
name = "runner"
path = "src/main.rs"

[build-dependencies]
chrono = "0.4.44"

[dependencies]
anyhow = "1.0.102"
chrono = { version = "0.4.44", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4.6.1", features = ["derive"] }
crm_tool = { path = "../.." }
lazy_static = "1.5.0"
open = "5.3.5"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "stream", "rustls", "query"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tempfile = "3.10.1"
tokio = { version = "1.52.3", default-features = false, features = ["rt-multi-thread", "macros", "fs", "io-util", "time", "sync", "net", "process", "signal"] }
tracing = "0.1.44"
urlencoding = "2.1.3"
walkdir = "2.4.0"

[target.'cfg(target_os = "windows")'.dependencies]
tray-icon = "0.24.0"
muda = "0.19.2"
winit = "0.30.13"
