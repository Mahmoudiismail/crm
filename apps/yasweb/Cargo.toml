[package]
name = "yasweb"
version = "1.1.0"
edition = "2021"
autobins = false

[[bin]]
name = "yasweb"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
chrono = "0.4.44"
clap = { version = "4.6.1", features = ["derive"] }
crm_tool = { path = "../.." }
fs2 = "0.4.3"
futures-util = "0.3.32"
headless_chrome = "1.0.21"
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "fs", "io-util", "time", "sync", "net", "process", "signal"] }
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3.10.1"
