[package]
name = "wxcc_handler"
version = "0.1.0"
edition = "2021"
autobins = false

[[bin]]
name = "wxcc_handler"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
chrono = { version = "0.4.44", default-features = false, features = ["clock", "std"] }
csv = "1.3.0"
clap = { version = "4.6.1", features = ["derive"] }
crm_tool = { path = "../.." }
rand = "0.10.1"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "form", "query", "rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", default-features = false, features = ["rt-multi-thread", "macros", "fs", "io-util", "time", "net"] }
tracing = "0.1.44"
urlencoding = "2.1.3"
