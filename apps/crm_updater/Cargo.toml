[package]
name = "crm_updater"
version = "1.1.0"
edition = "2021"
autobins = false

[lib]
name = "crm_updater_app"
path = "src/lib.rs"

[[bin]]
name = "crm_updater"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
chrono = { version = "0.4.44", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4.6.1", features = ["derive"] }
crm_tool = { path = "../.." }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tempfile = "3.10.1"
tracing = "0.1.44"
walkdir = "2.4.0"
zip = { version = "9.0.0", features = ["aes-crypto", "deflate"] }
