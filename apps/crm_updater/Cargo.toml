[package]
name = "crm_updater"
version = "1.1.0"
edition = "2021"
autobins = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "crm_updater"
path = "src/main.rs"

[dependencies]
fs2 = "0.4"
csv = "1.3.0"
walkdir = "2.4.0"
# Async runtime — only the features we actually use
tokio = { version = "1.52.3", default-features = false, features = ["rt-multi-thread", "macros", "fs", "io-util", "time", "sync", "net", "process", "signal"] }
# HTTP client — rustls for Windows TLS, streaming for CSV download
reqwest = { version = "0.13.4", default-features = false, features = ["json", "stream", "rustls", "query"] }
# Serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
# Error handling
anyhow = "1.0.102"
# Logging — minimal features
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "registry", "smallvec"] }
tracing-appender = "0.2.5"
# Date/time
chrono = { version = "0.4.44", default-features = false, features = ["clock", "serde", "std"] }
# Async utilities — only what we use (StreamExt, join_all)
futures-util = { version = "0.3.32", default-features = false, features = ["alloc"] }
# SRP big integer math
num-bigint = "0.4.6"
# Cryptography
sha2 = "0.11.0"
hmac = "0.13.0"
hex = { version = "0.4.3", default-features = false, features = ["std"] }
rand = "0.10.1"
base64 = { version = "0.22.1", default-features = false, features = ["std"] }
# URL decoding for CSV filenames
urlencoding = "2.1.3"
chrono-tz = "0.10.4"
open = "5.3.5"
headless_chrome = "1.0.21"
rust_xlsxwriter = "0.101.0"
lazy_static = "1.5.0"
tempfile = "3.10.1"
zip = { version = "9.0.0", features = ["aes-crypto", "deflate"] }
winsafe = { version = "0.0.28", features = ["oleaut"] }
calamine = "0.37.0"
clap = { version = "4.6.1", features = ["derive"] }
crm_tool = { path = "../.." }


[dev-dependencies]
criterion = "0.8.2"
filetime = "0.2.29"
regex = "1.13.0"
reqwest = { version = "0.13.4", features = ["blocking"] }
tempfile = "3.10.1"
