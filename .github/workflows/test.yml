name: Test

on:
  pull_request:
    branches: [main]
    paths:
      - '**/*.rs'
      - '**/*.js'
      - '**/*.ps1'
      - '**/*.json'
      - '**/*.jsonc'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/test.yml'
      - '.github/workflows/auto-format.yml'
      - '.github/workflows/release.yml'
      - '.gitignore'
      - 'deny.toml'
  push:
    branches: [main]
    paths:
      - '**/*.rs'
      - '**/*.js'
      - '**/*.ps1'
      - '**/*.json'
      - '**/*.jsonc'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/test.yml'
      - '.github/workflows/auto-format.yml'
      - '.github/workflows/release.yml'
      - '.gitignore'
      - 'deny.toml'
  workflow_dispatch:

permissions:
  contents: read

env:
  RUSTFLAGS: "-Dwarnings"

jobs:
  format:
    name: Format and Auto-fix
    environment: format-approval
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - name: Format Rust files
        run: cargo fmt

      - name: Commit formatting changes when needed
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
        run: |
          git diff --check
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u -- '*.rs'
            git commit -m "style: apply cargo fmt"
            git push origin "HEAD:${TARGET_BRANCH}"
          else
            echo "Rust files are already formatted."
          fi

      - name: Verify formatting
        run: cargo fmt -- --check

  clippy:
    name: Clippy Lints
    needs: format
    runs-on: windows-latest

    steps:
      - name: Checkout formatted source
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-repo-windows
          key: clippy
          save-if: ${{ github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
          cache-on-failure: true

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings



  dependency-audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
          persist-credentials: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Resolve updated dependency graph
        run: cargo update

      - name: Commit updated lockfile
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- Cargo.lock; then
            git add Cargo.lock
            git commit -m "fix(deps): refresh Cargo.lock security fixes"
            git push origin "HEAD:${TARGET_BRANCH}"
          else
            echo "Cargo.lock is already current."
          fi

      - name: Export updated lockfile for review
        uses: actions/upload-artifact@v4
        with:
          name: updated-cargo-lock
          path: Cargo.lock
          if-no-files-found: error

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit RustSec advisories
        run: cargo audit

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Check configured advisory policy
        run: cargo deny check advisories

  test:
    name: Test Suite
    needs: [format, clippy]
    if: always() && needs.format.result == 'success'
    runs-on: windows-latest

    steps:
      - name: Checkout formatted source
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
          persist-credentials: false

      - name: Check JavaScript syntax
        shell: pwsh
        run: |
          Get-ChildItem -Path src -Recurse -Filter *.js | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Check PowerShell syntax
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Path src -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $failed = $true
              Write-Error "PowerShell syntax errors in $($_.FullName)"
              $parseErrors | ForEach-Object { Write-Error $_.Message }
            }
          }
          if ($failed) { exit 1 }

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-repo-windows
          key: test
          save-if: ${{ github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
          cache-on-failure: true

      - name: Run tests
        run: cargo test --workspace --all-targets --all-features
