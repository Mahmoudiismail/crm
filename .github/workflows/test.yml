name: Test

# Keep only the newest CI run for each PR or branch.
concurrency:
  group: test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main]
    paths:
      - '**/*.rs'
      - '**/*.js'
      - '**/*.ps1'
      - '**/*.json'
      - '**/*.jsonc'
      - 'Cargo.toml'
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - '**/Cargo.lock'
      - '.github/workflows/test.yml'
      - '.github/workflows/auto-format.yml'
      - '.github/workflows/release.yml'
      - '.github/scripts/**'
      - '.gitignore'
      - 'deny.toml'
  push:
    branches: [main]
    paths:
      - '**/*.rs'
      - '**/*.js'
      - '**/*.ps1'
      - '**/*.json'
      - '**/*.jsonc'
      - 'Cargo.toml'
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - '**/Cargo.lock'
      - '.github/workflows/test.yml'
      - '.github/workflows/auto-format.yml'
      - '.github/workflows/release.yml'
      - '.github/scripts/**'
      - '.gitignore'
      - 'deny.toml'
  workflow_dispatch:

permissions:
  contents: read

env:
  RUSTFLAGS: "-Dwarnings"

jobs:
  detect-packages:
    name: Detect affected packages
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.detect.outputs.packages }}
      javascript: ${{ steps.detect.outputs.javascript }}
      powershell: ${{ steps.detect.outputs.powershell }}
      runner_javascript: ${{ steps.detect.outputs.runner_javascript }}
      dependencies: ${{ steps.detect.outputs.dependencies }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: detect
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch || 'main' }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            BASE_SHA="$PR_BASE_SHA"
            HEAD_SHA="$PR_HEAD_SHA"
          elif [[ -n "$PUSH_BEFORE_SHA" && ! "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$PUSH_BEFORE_SHA"
            HEAD_SHA="$PUSH_AFTER_SHA"
          else
            git fetch origin "$BASE_REF"
            BASE_SHA="$(git merge-base "origin/$BASE_REF" "$PUSH_AFTER_SHA")"
            HEAD_SHA="$PUSH_AFTER_SHA"
          fi

          if [[ -z "$BASE_SHA" || -z "$HEAD_SHA" ]]; then
            echo "::error::Unable to resolve the exact base/head commits for package detection."
            exit 1
          fi

          git diff --name-only "$BASE_SHA...$HEAD_SHA" > changed-files.txt
          echo "Compared commits: $BASE_SHA...$HEAD_SHA"
          echo "Changed paths:"
          cat changed-files.txt

          python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
          python3 .github/scripts/detect_affected_packages.py changed-files.txt > detection.json
          PACKAGES="$(python3 -c 'import json; print(json.dumps(json.load(open("detection.json"))["packages"], separators=(",", ":")))' )"
          JS_CHANGED="$(python3 -c 'import json; print(str(json.load(open("detection.json"))["javascript"]).lower())')"
          PS_CHANGED="$(python3 -c 'import json; print(str(json.load(open("detection.json"))["powershell"]).lower())')"
          RUNNER_JS_CHANGED="$(python3 -c 'import json; print(str(json.load(open("detection.json"))["runner_javascript"]).lower())')"
          DEPENDENCIES_CHANGED="$(python3 -c 'import json; print(str(json.load(open("detection.json"))["dependencies"]).lower())')"
          printf 'packages=%s\n' "$PACKAGES" >> "$GITHUB_OUTPUT"
          printf 'javascript=%s\n' "$JS_CHANGED" >> "$GITHUB_OUTPUT"
          printf 'powershell=%s\n' "$PS_CHANGED" >> "$GITHUB_OUTPUT"
          printf 'runner_javascript=%s\n' "$RUNNER_JS_CHANGED" >> "$GITHUB_OUTPUT"
          printf 'dependencies=%s\n' "$DEPENDENCIES_CHANGED" >> "$GITHUB_OUTPUT"

          echo "Package matrix output: $PACKAGES"
          echo "JavaScript changed: $JS_CHANGED"
          echo "PowerShell changed: $PS_CHANGED"
          echo "Runner JavaScript changed: $RUNNER_JS_CHANGED"
          echo "Dependency files changed: $DEPENDENCIES_CHANGED"

  format:
    name: Format and Auto-fix
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - name: Refresh Cargo.lock for workspace manifests
        run: cargo metadata --format-version 1 > $null

      - name: Format Rust files
        run: cargo fmt

      - name: Commit formatting changes when needed
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
        run: |
          git diff --check
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u -- '*.rs' Cargo.lock
            git commit -m "chore: format Rust and refresh Cargo.lock"
            git push origin "HEAD:${TARGET_BRANCH}"
          else
            echo "Rust files are already formatted."
          fi

      - name: Verify formatting
        run: cargo fmt -- --check

  clippy:
    name: Clippy Lints
    needs: [format, detect-packages]
    if: needs.detect-packages.outputs.packages != '[]'
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.detect-packages.outputs.packages) }}
    runs-on: windows-latest

    steps:
      - name: Checkout formatted source
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-repo-windows
          key: clippy
          save-if: ${{ github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
          cache-on-failure: true

      - name: Run clippy
        run: cargo clippy -p ${{ matrix.package }} --all-targets --all-features --locked -- -D warnings



  dependency-audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit RustSec advisories
        run: cargo audit

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Check configured advisory policy
        run: cargo deny check advisories

  test:
    name: Rust Tests (\${{ matrix.package }})
    needs: [format, clippy, detect-packages]
    if: needs.detect-packages.outputs.packages != '[]'
    strategy:
      fail-fast: false
      matrix:
        package: \${{ fromJson(needs.detect-packages.outputs.packages) }}
    runs-on: windows-latest

    steps:
      - name: Checkout formatted source
        uses: actions/checkout@v7
        with:
          repository: \${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: \${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-repo-windows
          key: test
          save-if: \${{ github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
          cache-on-failure: true

      - name: Run package tests
        run: cargo test -p \${{ matrix.package }} --all-targets --all-features --locked

      - name: Build affected package in release mode
        run: cargo build --release -p \${{ matrix.package }} --locked

  javascript-validation:
    name: JavaScript Validation
    needs: [detect-packages]
    if: needs.detect-packages.outputs.javascript == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: \${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: \${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
          persist-credentials: false
      - name: Check JavaScript syntax
        shell: pwsh
        run: |
          Get-ChildItem -Path src,apps -Recurse -Filter *.js | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Test Runner JavaScript validation
        if: needs.detect-packages.outputs.runner_javascript == 'true'
        run: node --test apps/runner/tests/validation.test.js

  powershell-validation:
    name: PowerShell Validation
    needs: [detect-packages]
    if: needs.detect-packages.outputs.powershell == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: \${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: \${{ github.event.pull_request.head.ref || github.ref_name }}
          persist-credentials: false
      - name: Check PowerShell syntax
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Path src,apps -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $failed = $true
              Write-Error "PowerShell syntax errors in $($_.FullName)"
              $parseErrors | ForEach-Object { Write-Error $_.Message }
            }
          }
          if ($failed) { exit 1 }

  dependency-audit:
    name: Dependency Security Audit
    needs: [detect-packages]
    if: needs.detect-packages.outputs.dependencies == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit RustSec advisories
        run: cargo audit

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Check configured advisory policy
        run: cargo deny check advisories
