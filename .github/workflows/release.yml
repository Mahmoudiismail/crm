name: Release Binaries

on:
  workflow_dispatch:
    inputs:
      binary:
        description: Binary to release (comma separated, or "all")
        required: true
        default: all
        type: string

permissions:
  contents: write

concurrency:
  group: release-build-history
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare Build Info
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.vars.outputs.version }}
      build_date: ${{ steps.vars.outputs.build_date }}
      source_sha: ${{ steps.vars.outputs.source_sha }}
      started_at: ${{ steps.vars.outputs.started_at }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - id: vars
        shell: bash
        run: |
          set -euo pipefail
          STARTED_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          VERSION=$(grep '^version =' Cargo.toml | head -n1 | awk -F '"' '{print $2}')
          BUILD_DATE=$(date -u +'%Y%m%d_%H%M%S')
          SOURCE_SHA=$(git rev-parse HEAD)
          echo "started_at=$STARTED_AT" >> "$GITHUB_OUTPUT"
          echo "build_date=$BUILD_DATE" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          if [[ -z "$VERSION" ]]; then
            echo "Unable to determine package version from Cargo.toml." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  release:
    name: Build & Release
    needs: prepare
    if: always() && needs.prepare.result == 'success'
    runs-on: windows-latest
    outputs:
      build_status: ${{ steps.summary.outputs.build_status }}
      release_status: ${{ steps.summary.outputs.release_status }}
      failure_reason: ${{ steps.summary.outputs.failure_reason }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      BUILD_DATE: ${{ needs.prepare.outputs.build_date }}
      BINARY_INPUT: ${{ inputs.binary }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 0
      # Existing version tags are allowed: the ZIP filename contains a unique UTC
      # build timestamp and overwrite_files=false preserves every prior asset.
      - uses: dtolnay/rust-toolchain@stable
        if: success()
        with:
          targets: x86_64-pc-windows-msvc
      - name: Rust Cache
        if: success()
        uses: Swatinem/rust-cache@v2
      - name: Build and package selected binaries
        id: build
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          ALL_BINS=(crm runner yasweb tasker crm_updater)
          if [[ "$BINARY_INPUT" == "all" ]]; then
            SELECTED_BINS=("${ALL_BINS[@]}")
          else
            IFS=',' read -r -a SELECTED_BINS <<< "$BINARY_INPUT"
            if [[ ${#SELECTED_BINS[@]} -eq 0 ]]; then
              echo "No binary selected." >&2
              exit 1
            fi
            for i in "${!SELECTED_BINS[@]}"; do
              bin="$(echo "${SELECTED_BINS[$i]}" | xargs)"
              case "$bin" in
                crm|runner|yasweb|tasker|crm_updater) ;;
                *)
                  echo "Unsupported binary: '$bin'. Allowed: ${ALL_BINS[*]}" >&2
                  exit 1
                  ;;
              esac
              SELECTED_BINS[$i]="$bin"
            done
          fi
          declare -A SEEN=()
          for bin in "${SELECTED_BINS[@]}"; do
            if [[ -n "${SEEN[$bin]+x}" ]]; then
              echo "Duplicate binary: '$bin'." >&2
              exit 1
            fi
            SEEN[$bin]=1
          done
          BUILD_ARGS=()
          EXE_FILES=()
          for bin in "${SELECTED_BINS[@]}"; do
            BUILD_ARGS+=(--bin "$bin")
            EXE_FILES+=("$bin.exe")
          done
          cargo build --release "${BUILD_ARGS[@]}"
          ARCHIVE="crm_tool_v${VERSION}_${BUILD_DATE}_windows.zip"
          (
            cd target/release
            7z a -p123456 "$ARCHIVE" "${EXE_FILES[@]}"
          )
      - name: Publish GitHub Release
        id: publish
        if: success()
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}
          name: Release v${{ env.VERSION }}
          body: |
            Built binaries: ${{ inputs.binary }}
            The application was built from main by this workflow.
          draft: false
          prerelease: false
          overwrite_files: false
          generate_release_notes: true
          files: target/release/crm_tool_v${{ env.VERSION }}_${{ env.BUILD_DATE }}_windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload Artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: crm_tool_windows_zip
          path: target/release/crm_tool_v${{ env.VERSION }}_${{ env.BUILD_DATE }}_windows.zip
          retention-days: 1
      - name: Summarize release attempt
        id: summary
        if: always()
        shell: bash
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        run: |
          BUILD_STATUS=not_started
          RELEASE_STATUS=not_started
          FAILURE_REASON=
          if [[ "$BUILD_OUTCOME" == "success" ]]; then
            BUILD_STATUS=success
          elif [[ "$BUILD_OUTCOME" == "failure" ]]; then
            BUILD_STATUS=failed
            FAILURE_REASON="binary build or packaging failed"
          fi
          if [[ "$PUBLISH_OUTCOME" == "success" ]]; then
            RELEASE_STATUS=success
          elif [[ "$PUBLISH_OUTCOME" == "failure" ]]; then
            RELEASE_STATUS=failed
            FAILURE_REASON="GitHub Release publication failed"
          fi
          echo "build_status=$BUILD_STATUS" >> "$GITHUB_OUTPUT"
          echo "release_status=$RELEASE_STATUS" >> "$GITHUB_OUTPUT"
          echo "failure_reason=$FAILURE_REASON" >> "$GITHUB_OUTPUT"

  record-history:
    name: Record Build History
    needs: [prepare, release]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: true
      - name: Append attempt to V1 history
        shell: bash
        env:
          STARTED_AT: ${{ needs.prepare.outputs.started_at }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SELECTED_BINARIES: ${{ inputs.binary }}
          BUILD_STATUS: ${{ needs.release.outputs.build_status }}
          RELEASE_STATUS: ${{ needs.release.outputs.release_status }}
          FAILURE_REASON: ${{ needs.release.outputs.failure_reason }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          RELEASE_RESULT: ${{ needs.release.result }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path("plan/v1-release-build-history.csv")
          path.parent.mkdir(parents=True, exist_ok=True)
          fields = [
              "timestamp_utc", "run_id", "run_attempt", "source_sha", "version",
              "binary_to_release", "build_status", "release_status", "failure_reason",
          ]
          timestamp = os.environ.get("STARTED_AT") or datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          build_status = os.environ.get("BUILD_STATUS") or "not_started"
          release_status = os.environ.get("RELEASE_STATUS") or "not_started"
          failure_reason = os.environ.get("FAILURE_REASON") or ""
          if os.environ.get("PREPARE_RESULT") != "success":
              failure_reason = "build preparation failed"
          elif os.environ.get("RELEASE_RESULT") not in ("success", "failure"):
              failure_reason = failure_reason or "release job did not complete"
          row = {
              "timestamp_utc": timestamp,
              "run_id": os.environ["RUN_ID"],
              "run_attempt": os.environ["RUN_ATTEMPT"],
              "source_sha": os.environ.get("SOURCE_SHA") or os.environ["EVENT_SHA"],
              "version": os.environ.get("VERSION") or "unknown",
              "binary_to_release": os.environ.get("SELECTED_BINARIES") or "unknown",
              "build_status": build_status,
              "release_status": release_status,
              "failure_reason": failure_reason,
          }
          exists = path.exists() and path.stat().st_size > 0
          with path.open("a", newline="", encoding="utf-8") as stream:
              writer = csv.DictWriter(stream, fieldnames=fields)
              if not exists:
                  writer.writeheader()
              writer.writerow(row)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plan/v1-release-build-history.csv
          if git diff --cached --quiet; then
            echo "No history change to commit."
            exit 0
          fi
          git commit -m "chore(release): record build attempt ${RUN_ID}.${RUN_ATTEMPT}"
          git push origin HEAD:main
