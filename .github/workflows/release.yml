name: Release Binaries

on:
  workflow_dispatch:
    inputs:
      binary:
        description: Binary to release (comma separated, or "all")
        required: true
        default: all
        type: string

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare Build Info
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.vars.outputs.version }}
      build_date: ${{ steps.vars.outputs.build_date }}

    steps:
      - uses: actions/checkout@v7

      - id: vars
        shell: bash
        run: |
          VERSION=$(grep '^version =' Cargo.toml | head -n1 | awk -F '"' '{print $2}')
          BUILD_DATE=$(date -u +'%Y%m%d_%H%M%S')

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build_date=$BUILD_DATE" >> $GITHUB_OUTPUT

  release:
    name: Build & Release
    needs: prepare
    runs-on: windows-latest

    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      BUILD_DATE: ${{ needs.prepare.outputs.build_date }}
      BINARY_INPUT: ${{ inputs.binary }}

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build and package selected binaries
        shell: bash
        run: |
          set -euo pipefail

          ALL_BINS=(crm runner yasweb wcxx tasker crm_updater)
          if [[ "$BINARY_INPUT" == "all" ]]; then
            SELECTED_BINS=("${ALL_BINS[@]}")
          else
            IFS=',' read -r -a SELECTED_BINS <<< "$BINARY_INPUT"
            if [[ ${#SELECTED_BINS[@]} -eq 0 ]]; then
              echo "No binary selected." >&2
              exit 1
            fi

            for i in "${!SELECTED_BINS[@]}"; do
              bin="$(echo "${SELECTED_BINS[$i]}" | xargs)"
              case "$bin" in
                crm|runner|yasweb|wcxx|tasker|crm_updater) ;;
                *)
                  echo "Unsupported binary: '$bin'. Allowed: ${ALL_BINS[*]}" >&2
                  exit 1
                  ;;
              esac
              SELECTED_BINS[$i]="$bin"
            done
          fi

          # Reject duplicate names to keep the requested selection unambiguous.
          declare -A SEEN=()
          for bin in "${SELECTED_BINS[@]}"; do
            if [[ -n "${SEEN[$bin]+x}" ]]; then
              echo "Duplicate binary: '$bin'." >&2
              exit 1
            fi
            SEEN[$bin]=1
          done

          BUILD_ARGS=()
          EXE_FILES=()
          for bin in "${SELECTED_BINS[@]}"; do
            BUILD_ARGS+=(--bin "$bin")
            EXE_FILES+=("$bin.exe")
          done

          cargo build --release "${BUILD_ARGS[@]}"

          ARCHIVE="crm_tool_v${VERSION}_${BUILD_DATE}_windows.zip"
          7z a -p123456 "$ARCHIVE" "${EXE_FILES[@]}" -w"$(pwd)/target/release"

          # Keep the archive in the release directory for the upload steps.
          mv "$ARCHIVE" target/release/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}
          name: Release v${{ env.VERSION }}
          body: |
            Built binaries: ${{ inputs.binary }}
            The application was built by this workflow.
          draft: false
          prerelease: false
          overwrite_files: true
          generate_release_notes: true
          files: target/release/crm_tool_v${{ env.VERSION }}_${{ env.BUILD_DATE }}_windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: crm_tool_windows_zip
          path: target/release/crm_tool_v${{ env.VERSION }}_${{ env.BUILD_DATE }}_windows.zip
          retention-days: 1
