name: Release Binaries

on:
  workflow_dispatch:
    inputs:
      binary:
        description: Binary to release (comma separated, or "all")
        required: true
        default: all
        type: string

permissions:
  contents: write

# The history CSV is a shared repository file; serialize runs to avoid lost updates.
concurrency:
  group: release-build-history
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare Build Info
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.vars.outputs.version }}
      build_date: ${{ steps.vars.outputs.build_date }}
      source_sha: ${{ steps.vars.outputs.source_sha }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - id: vars
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(grep '^version =' Cargo.toml | head -n1 | awk -F '"' '{print $2}')
          BUILD_DATE=$(date -u +'%Y%m%d_%H%M%S')
          SOURCE_SHA=$(git rev-parse HEAD)

          if [[ -z "$VERSION" ]]; then
            echo "Unable to determine package version from Cargo.toml." >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_date=$BUILD_DATE" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

  release:
    name: Build & Release
    needs: prepare
    runs-on: windows-latest

    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      BUILD_DATE: ${{ needs.prepare.outputs.build_date }}
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
      BINARY_INPUT: ${{ inputs.binary }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 0

      - name: Record release attempt
        id: record_start
        uses: actions/github-script@v7
        with:
          script: |
            const path = "plan/v1-release-build-history.csv";
            const quote = (value) => '"' + String(value ?? "").replace(/"/g, '""').replace(/[\r\n]+/g, " ") + '"';
            const row = [
              new Date().toISOString(),
              context.runId,
              context.runAttempt,
              process.env.SOURCE_SHA,
              process.env.VERSION,
              process.env.BINARY_INPUT,
              "in_progress",
              "not_started",
              ""
            ].map(quote).join(",");

            const { data } = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              ref: "main"
            });
            if (Array.isArray(data) || data.type !== "file") {
              throw new Error("Release history path is not a file.");
            }

            const content = Buffer.from(data.content, "base64").toString("utf8");
            const marker = `,"${context.runId}","${context.runAttempt}",`;
            if (content.split(/\r?\n/).some(line => line.includes(marker))) {
              throw new Error("This workflow attempt is already recorded.");
            }
            const updated = content.replace(/\s*$/, "") + "\n" + row + "\n";
            await github.rest.repos.updateFile({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              message: `chore(release): record attempt ${context.runId}.${context.runAttempt}`,
              content: Buffer.from(updated, "utf8").toString("base64"),
              sha: data.sha,
              branch: "main"
            });

      - name: Reject an existing version tag
        id: reject_tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          TAG_REF="$(git ls-remote --tags origin "refs/tags/${TAG}")" || {
            echo "Unable to check remote tag state; refusing to publish." >&2
            exit 1
          }
          if [[ -n "$TAG_REF" ]]; then
            echo "Release tag ${TAG} already exists; refusing to overwrite an existing version." >&2
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build and package selected binaries
        id: build
        shell: bash
        run: |
          set -euo pipefail

          ALL_BINS=(crm runner yasweb wcxx tasker crm_updater)
          if [[ "$BINARY_INPUT" == "all" ]]; then
            SELECTED_BINS=("${ALL_BINS[@]}")
          else
            IFS=',' read -r -a SELECTED_BINS <<< "$BINARY_INPUT"
            if [[ ${#SELECTED_BINS[@]} -eq 0 ]]; then
              echo "No binary selected." >&2
              exit 1
            fi

            for i in "${!SELECTED_BINS[@]}"; do
              bin="$(echo "${SELECTED_BINS[$i]}" | xargs)"
              case "$bin" in
                crm|runner|yasweb|wcxx|tasker|crm_updater) ;;
                *)
                  echo "Unsupported binary: '$bin'. Allowed: ${ALL_BINS[*]}" >&2
                  exit 1
                  ;;
              esac
              SELECTED_BINS[$i]="$bin"
            done
          fi

          declare -A SEEN=()
          for bin in "${SELECTED_BINS[@]}"; do
            if [[ -n "${SEEN[$bin]+x}" ]]; then
              echo "Duplicate binary: '$bin'." >&2
              exit 1
            fi
            SEEN[$bin]=1
          done

          BUILD_ARGS=()
          EXE_FILES=()
          for bin in "${SELECTED_BINS[@]}"; do
            BUILD_ARGS+=(--bin "$bin")
            EXE_FILES+=("$bin.exe")
          done

          cargo build --release "${BUILD_ARGS[@]}"

          ARCHIVE="crm_tool_v${VERSION}_${BUILD_DATE}_windows.zip"
          (
            cd target/release
            7z a -p123456 "$ARCHIVE" "${EXE_FILES[@]}"
          )

      - name: Publish GitHub Release
        id: publish
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}
          name: Release v${{ env.VERSION }}
          body: |
            Built binaries: ${{ inputs.binary }}
            The application was built from main by this workflow.
          draft: false
          prerelease: false
          overwrite_files: false
          generate_release_notes: true
          files: target/release/crm_tool_v${{ env.VERSION }}_${{ env.BUILD_DATE }}_windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: crm_tool_windows_zip
          path: target/release/crm_tool_v${{ env.VERSION }}_${{ env.BUILD_DATE }}_windows.zip
          retention-days: 1

      - name: Finalize release history
        if: always() && steps.record_start.outcome == 'success'
        uses: actions/github-script@v7
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
          BINARY_INPUT: ${{ inputs.binary }}
          TAG_OUTCOME: ${{ steps.reject_tag.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          RELEASE_OUTCOME: ${{ steps.publish.outcome }}
        with:
          script: |
            const path = "plan/v1-release-build-history.csv";
            const quote = (value) => '"' + String(value ?? "").replace(/"/g, '""').replace(/[\r\n]+/g, " ") + '"';
            const stageStatus = (outcome) => outcome === "success" ? "success" : outcome === "failure" ? "failure" : "not_started";
            let reason = "";
            if (process.env.TAG_OUTCOME === "failure") reason = "tag_check_failed";
            else if (process.env.BUILD_OUTCOME === "failure") reason = "build_failed";
            else if (process.env.RELEASE_OUTCOME === "failure") reason = "release_failed";

            const { data } = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              ref: "main"
            });
            if (Array.isArray(data) || data.type !== "file") {
              throw new Error("Release history path is not a file.");
            }

            const content = Buffer.from(data.content, "base64").toString("utf8");
            const lines = content.split(/\r?\n/);
            const marker = `,"${context.runId}","${context.runAttempt}",`;
            const index = lines.findIndex(line => line.includes(marker));
            if (index < 0) throw new Error("Could not find the initial release history row.");

            const timestampMatch = lines[index].match(/^"((?:[^"]|"")*)"/);
            if (!timestampMatch) throw new Error("Invalid timestamp in release history row.");
            const originalTimestamp = timestampMatch[1].replace(/""/g, '"');
            lines[index] = [
              originalTimestamp,
              context.runId,
              context.runAttempt,
              process.env.SOURCE_SHA,
              process.env.VERSION,
              process.env.BINARY_INPUT,
              stageStatus(process.env.BUILD_OUTCOME),
              stageStatus(process.env.RELEASE_OUTCOME),
              reason
            ].map(quote).join(",");

            await github.rest.repos.updateFile({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              message: `chore(release): finalize attempt ${context.runId}.${context.runAttempt}`,
              content: Buffer.from(lines.join("\n").replace(/\n+$/, "\n"), "utf8").toString("base64"),
              sha: data.sha,
              branch: "main"
            });
